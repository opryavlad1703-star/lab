<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechShop — Кошик</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

 
    <header class="header">
        <div class="logo">TechShop</div>
        <nav class="nav">
            <a href="index.html">Головна</a>

            <button class="btn-cart" id="openCartBtn">
                🛒 Кошик (<span id="cartCount">0</span>)
            </button>
        </nav>
    </header>


    <div class="loader-container" id="loader">
        <div class="spinner"></div>
        <p>Завантаження товарів...</p>
    </div>

    <div id="products-grid" class="products-grid"></div>

    <div class="modal-overlay hidden" id="cartOverlay">
        <div class="modal-window">
            <div class="modal-header">
                <h2>Ваш Кошик</h2>
                <button class="close-btn" id="closeCartBtn">&times;</button>
            </div>

            <div class="cart-items" id="cartItemsContainer">
                <p>Кошик порожній.</p>
            </div>

            <div class="modal-footer">
                <h3>Разом: <span id="cartTotalSum">0</span> грн</h3>
                <a href="checkout.html" class="btn btn-primary" id="checkoutBtn">Оформити замовлення</a>
            </div>
        </div>
    </div>

    <script src="./assets/js/main.js" type="module"></script>
</body>
</html>
